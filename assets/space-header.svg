<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1400" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="88" y1="274" x2="1312" y2="274" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame">
      <rect width="1400" height="360" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1400" height="360" rx="24" fill="url(#background)"/>

  <g clip-path="url(#frame)">
    <circle cx="1190" cy="80" r="130" fill="#8B5CF6" fill-opacity=".12" filter="url(#glow)"/>
    <circle cx="1260" cy="300" r="150" fill="#22D3EE" fill-opacity=".08" filter="url(#glow)"/>

    <path d="M88 274H1312" stroke="url(#accent)" stroke-width="2"/>
    <path d="M88 274H250" stroke="#F8FAFC" stroke-width="2"/>
    <circle cx="88" cy="274" r="5" fill="#22D3EE"/>

    <g fill="#CBD5E1" fill-opacity=".55">
      <circle cx="1100" cy="70" r="2"/>
      <circle cx="1170" cy="120" r="1.5"/>
      <circle cx="1285" cy="92" r="2"/>
      <circle cx="1330" cy="180" r="1.5"/>
      <circle cx="1220" cy="245" r="1.5"/>
      <circle cx="1050" cy="285" r="2"/>
    </g>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="88" y="104" fill="#67E8F9" font-size="14" font-weight="600" letter-spacing="3">
      FRONTEND DEVELOPER · UI BUILDER
    </text>
    <text x="84" y="178" fill="#F8FAFC" font-size="58" font-weight="700" letter-spacing="-2">
