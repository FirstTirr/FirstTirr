<svg width="1400" height="460" viewBox="0 0 1400 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1400" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03040D"/>
      <stop offset="0.48" stop-color="#080D22"/>
      <stop offset="1" stop-color="#150A2C"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(1080 165) rotate(140) scale(470 280)">
      <stop stop-color="#8B5CF6" stop-opacity=".28"/>
